# Everything that comes from a MetroRide environment variable is intentionally absent
# from this file: server.port/server.address, spring.datasource.url/username/password,
# spring.data.redis.host/port, metroride.consumer.group/name and
# spring.lifecycle.timeout-per-shutdown-phase are derived from FARE_SERVICE_ADDR,
# POSTGRES_DSN, REDIS_ADDR, CONSUMER_GROUP, CONSUMER_NAME and SHUTDOWN_TIMEOUT_SECONDS
# by MetroRideEnvironmentPostProcessor, so the service reads exactly the environment the
# Go services read. Defining any of them here would shadow the environment.

spring:
  application:
    name: fare-service
  main:
    banner-mode: off
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000   # ms; reliability.PostgresTimeout in the Go services is 2s
      validation-timeout: 1500   # ms; reliability.ReadinessTimeout in the Go services is 1.5s
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entity mapping matches it.
      ddl-auto: validate
  flyway:
    # fare-service owns the `fare` schema outright: Flyway creates it, keeps its history table
    # in it, and never has to baseline the init.sql-managed `public` schema shared with Go.
    schemas: fare
    locations: classpath:db/migration
  data:
    redis:
      timeout: 2s           # reliability.RedisTimeout in the Go services is 2s
      connect-timeout: 2s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

metroride:
  postgres:
    # Transaction timeout for every consumer write, the counterpart of the 2s
    # reliability.WithPostgresTimeout context the Go services put around each
    # PostgreSQL call. Hikari's connection-timeout above only bounds obtaining a
    # connection from the pool; this bounds the SQL that runs on it.
    timeout-seconds: 2
  fare:
    # Rate card for the quote written on ride_assigned:
    #   quote = base-fare + per-km * distance_km + per-minute * eta_seconds / 60
    # Exact decimals bound to FareProperties; rounding to cents happens once, in Money.
    base-fare: 2.50
    per-km: 1.20
    per-minute: 0.30
    # Driver's share of a settled fare. Bound and validated now; read once settlement exists.
    driver-share: 0.80
  consumer:
    stream: events.ride.assignments
    batch-size: 10         # COUNT for XREADGROUP and for XAUTOCLAIM
    block-timeout: 1s      # must stay below spring.data.redis.timeout
    error-backoff: 1s
    # Pending-entry recovery. Every reclaim-interval, before its next XREADGROUP, the
    # consumer thread runs one XAUTOCLAIM over the group's pending entry list, starting
    # where the previous pass stopped (its returned cursor; 0-0 starts over), and pushes
    # up to batch-size entries that have been pending for at least reclaim-min-idle
    # through the normal handler. An entry whose handling failed for a retryable reason
    # therefore comes back within reclaim-interval + reclaim-min-idle of its last
    # delivery while the pending list is short, and in its turn when it is long.
    reclaim-interval: 5s
    # Redis measures idle time from the delivery of the whole XREADGROUP batch, and the
    # entries of a batch are handled one after another (up to about 4s each: 2s to get a
    # connection, 2s of transaction), so a second instance of this service can claim an
    # entry its owner has not reached yet. That overlap is safe because the primary key
    # of fare.processed_events serialises the two writers (one records, the other sees a
    # duplicate) and a poison entry may then be dead-lettered twice, which is accepted.
    # min-idle only bounds how soon such a claim can happen; it is not a lock.
    reclaim-min-idle: 5s
    # A retryable failure on an entry's max-deliveries-th delivery dead-letters it. Redis
    # keeps the delivery count in the pending entry list and only redelivers an entry
    # idle for at least reclaim-min-idle, so 25 deliveries guarantee at least
    # 24 x 5s = 120s of retrying counted from the first delivery, however old the entry
    # already was when this service first saw it. Under load the window is longer,
    # never shorter. The events this service consumes come from outbox relays that poll
    # every 250ms and back off up to 30s between attempts after a failed publish
    # (shared/pkg/outbox), so one failed publish delays an event by up to 30s and two
    # events of one ride can then arrive in either order; 120s is four times that. A
    # relay that stays down longer delays its event for as long as it is down, so the
    # window is a margin for the ordinary case, not a bound.
    max-deliveries: 25

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: fare-service
