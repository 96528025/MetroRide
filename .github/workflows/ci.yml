name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker Compose stack
        run: docker compose build

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Run integration tests
        run: go test -tags=integration ./tests/integration

      - name: Run routing outage dead-letter integration test
        id: failure-integration
        timeout-minutes: 2
        run: bash scripts/failure-integration-test.sh

      - name: Print routing outage logs on failure
        if: failure() && steps.failure-integration.outcome == 'failure'
        run: docker compose logs --no-color dispatch-service routing-service redis

      - name: Print Docker Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shut down Docker Compose stack
        if: always()
        run: docker compose down -v
