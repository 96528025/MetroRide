# Pull-request image acquisition.
#
# The six service images are built from this commit inside the runner and side-
# loaded into KinD with `kind load docker-image`. Nothing is published to GHCR
# and no MetroRide service image is pulled from a registry, so pull-request
# validation never depends on GHCR access, package visibility or image pull
# secrets. Public base and dependency images are still pulled.
imageSource: local-build
