{{- range $name, $svc := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "metroride.labels" $ | nindent 4 }}
    app: {{ $name }}
    # Marks the Services that expose a Prometheus /metrics endpoint, so the
    # ServiceMonitor cannot accidentally select the test-only data stores.
    metroride.io/metrics: "true"
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
{{- end }}
